<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        .box{
            text-align: center;
            /* border: 1px solid black; */
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }
        .success{
            background-color: lightgreen;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .warning{
            background-color: orange;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .danger{
            background-color: #ff9999;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>

</head>

<body>

    <h1>Bem vindo: {{ name }} - Página de Dashboard</h1>

    <div class="box">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

</body>
</html>
